start_zone:
  target:
    entity:
      integration: graas
      domain: valve
  fields:
    duration_minutes:
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: min
    liters:
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: L

stop_all:
  target:
    entity:
      integration: graas

