name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      # hacs/action 22.5.0
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # home-assistant/actions has no maintained release tags for hassfest: pinned to a master commit (2026-09-27).
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "ruff==0.16.10"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest Home Assistant the test plugin supports (requirements_test.txt).
          - python: "3.14"
            install: "-r requirements_test.txt"
          # Home Assistant 2026.2.3, the newest that runs on Python 3.13.
          - python: "3.13"
            install: "pytest-homeassistant-custom-component==0.13.316"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.install }}
      - run: python -m pytest -q
