name: Bug report
description: Something in the GRAAS integration doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your access token** (`graas_pat_…`). Diagnostics downloads already hide it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → GRAAS Irrigation → ⋮ → Download diagnostics. Drag the file here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from Settings → System → Logs (search for "graas").
      render: text
